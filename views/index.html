<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Dreinnify — рецензии и оценки музыки</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="Dreinnify — минималистичная платформа рецензий и оценок русскоязычной музыки. 90-балльная система, караоке, YouTube Music.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ============ ТОП-МЕНЮ ============ -->
<header id="topbar" class="topbar collapsed">
  <div class="topbar-inner glass">
    <a href="/" data-nav class="brand">
      <span class="brand-text">Dreinnify</span>
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="/" data-nav>Главная</a>
      <a href="/top" data-nav>Топ</a>
      <a href="/me" data-nav data-auth>Профиль</a>
      <a href="/verify" data-nav data-auth>Верификация</a>
      <a href="/admin" data-nav data-admin>Админ</a>
    </nav>
    <div class="nav-actions">
      <button id="btn-search" class="icon-btn" title="Поиск">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <div id="user-slot"></div>
    </div>
  </div>
</header>

<!-- ============ ПОИСК-ОВЕРЛЕЙ ============ -->
<div id="search-overlay" class="search-overlay hidden">
  <div class="search-panel glass">
    <div class="search-head">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search-input" type="text" placeholder="Название трека, альбома или артиста…" autocomplete="off">
      <button id="search-close" class="icon-btn">✕</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<!-- ============ ОСНОВНАЯ ЗОНА ============ -->
<main id="app" class="app"></main>

<!-- ============ ПЛЕЕР ============ -->
<div id="player" class="player hidden">
  <div class="player-inner glass">
    <img id="pl-cover" class="pl-cover" src="" alt="">
    <div class="pl-info">
      <div id="pl-title" class="pl-title"></div>
      <div id="pl-artist" class="pl-artist"></div>
    </div>
    <div class="pl-controls">
      <button id="pl-prev" class="icon-btn" title="Назад">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="pl-play" class="play-btn" title="Играть">
        <svg id="pl-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="pl-next" class="icon-btn" title="Дальше">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <div class="pl-bar">
      <span id="pl-time-cur">0:00</span>
      <div id="pl-progress" class="pl-progress"><div id="pl-progress-bar"></div></div>
      <span id="pl-time-tot">0:00</span>
    </div>
    <button id="pl-lyrics" class="icon-btn" title="Караоке">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
    </button>
    <button id="pl-close" class="icon-btn" title="Закрыть">✕</button>
  </div>
  <audio id="pl-audio" preload="none"></audio>
</div>

<!-- ============ КАРАОКЕ ============ -->
<div id="lyrics-overlay" class="lyrics-overlay hidden">
  <div class="lyrics-panel glass">
    <button id="lyrics-close" class="icon-btn lyrics-close">✕</button>
    <div id="lyrics-header" class="lyrics-header"></div>
    <div id="lyrics-body" class="lyrics-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
